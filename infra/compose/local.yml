services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iterminal
      POSTGRES_PASSWORD: ${ITERM_LOCAL_POSTGRES_PASSWORD:?ITERM_LOCAL_POSTGRES_PASSWORD is required}
      POSTGRES_USER: iterminal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iterminal -d iterminal"]
      interval: 2s
      timeout: 2s
      retries: 30
    ports:
      - "127.0.0.1:${ITERM_LOCAL_POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
