services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iterminal_test
      POSTGRES_PASSWORD: iterminal_test
      POSTGRES_USER: iterminal_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iterminal_test -d iterminal_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.3-alpine
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:5673:5672"
