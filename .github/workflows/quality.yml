name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: iterminal_test
          POSTGRES_PASSWORD: iterminal_test
          POSTGRES_USER: iterminal_test
        options: >-
          --health-cmd "pg_isready -U iterminal_test -d iterminal_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 20
        ports:
          - 5432:5432
      rabbitmq:
        image: rabbitmq:4.3-alpine
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 30
        ports:
          - 5672:5672
    env:
      ITERM_DATABASE_URL: postgresql://iterminal_test:iterminal_test@127.0.0.1:5432/iterminal_test
      ITERM_RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes zsh
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:m2
      - run: pnpm test:m3
      - run: pnpm test:m4:durable
      - run: pnpm test:m8:messaging
      - run: pnpm test:m8:dispatch
      - run: pnpm test:m8:interactions
      - run: pnpm test:m8:admission
      - run: pnpm test:m8:reconnect
        env:
          ITERM_TEST_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
      - run: pnpm test:m8:postgres-outage
        env:
          ITERM_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
